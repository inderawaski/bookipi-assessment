log_format safe_request '$request_method $status $request_time';
resolver 127.0.0.11 valid=5s ipv6=off;
upstream api_backend {
  zone api_backend 64k;
  server api:3000 resolve;
  keepalive 32;
}
server {
  listen 80;
  access_log /var/log/nginx/access.log safe_request;
  # Nginx request errors include raw URLs; keep identifiers out of error logs.
  error_log /dev/null;
  client_header_buffer_size 8k;
  large_client_header_buffers 2 8k;
  client_max_body_size 16k;
  location /api/ {
    proxy_pass http://api_backend/;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_connect_timeout 2s;
    proxy_read_timeout 5s;
  }
  location / { proxy_pass http://web:80; }
}
