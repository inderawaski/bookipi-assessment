# Used only with compose.test.yaml and a randomly generated flash-test project.
services:
  api:
    ports: ["127.0.0.1::3000"]
  worker:
    cpus: 1.0
    mem_limit: 512m
    build: { context: ., target: worker }
    environment:
      NODE_ENV: test
      DATABASE_URL: postgresql://flash_test:test_only@postgres:5432/flash_test
      REDIS_URL: redis://redis:6379
    ports: ["127.0.0.1::3001"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 2s
      timeout: 3s
      retries: 30
